# Configurazione deploy Netlify per RetroCam Chat (Vite SPA + PWA)
[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: tutte le route servono index.html (lasciando però intatti
# gli asset reali e i file della PWA).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Il service worker non deve essere messo in cache aggressiva.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
