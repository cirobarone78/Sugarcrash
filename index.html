<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candy Crush Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            text-align: center;
            padding: 20px;
        }

        .header {
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
        }

        .score-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            gap: 2px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 15px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .cell {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 30px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .cell:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .cell.selected {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            z-index: 10;
        }

        .cell.red { background: linear-gradient(135deg, #ff6b6b, #ee5a52); }
        .cell.blue { background: linear-gradient(135deg, #4ecdc4, #44a08d); }
        .cell.green { background: linear-gradient(135deg, #95e1d3, #fce38a); }
        .cell.yellow { background: linear-gradient(135deg, #fce38a, #f38ba8); }
        .cell.purple { background: linear-gradient(135deg, #a8edea, #fed6e3); }
        .cell.orange { background: linear-gradient(135deg, #ff9a9e, #fecfef); }

        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .combo-text {
            position: absolute;
            font-size: 20px;
            font-weight: bold;
            color: #feca57;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }

        .falling {
            animation: fall 0.5s ease-in-out;
        }

        @keyframes fall {
            0% { transform: translateY(-60px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .match-hint {
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🍭 Sweet Crush 🍭</h1>
            <div class="score-board">
                <div class="score-item">
                    <div>Punteggio</div>
                    <div id="score">0</div>
                </div>
                <div class="score-item">
                    <div>Mosse</div>
                    <div id="moves">30</div>
                </div>
                <div class="score-item">
                    <div>Livello</div>
                    <div id="level">1</div>
                </div>
            </div>
        </div>
        
        <div class="game-board" id="gameBoard"></div>
        
        <div class="buttons">
            <button onclick="restartGame()">Nuova Partita</button>
            <button onclick="showHint()">Suggerimento</button>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 8;
        const CANDY_TYPES = ['🍭', '🍬', '🧁', '🍪', '🎂', '🍩'];
        const COLORS = ['red', 'blue', 'green', 'yellow', 'purple', 'orange'];
        
        let board = [];
        let score = 0;
        let moves = 30;
        let level = 1;
        let selectedCell = null;
        let gameOver = false;

        function initGame() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            board = [];
            
            // Crea la griglia
            for (let row = 0; row < BOARD_SIZE; row++) {
                board[row] = [];
                for (let col = 0; col < BOARD_SIZE; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cell.addEventListener('click', cellClick);
                    
                    let candyType, colorType;
                    do {
                        candyType = Math.floor(Math.random() * CANDY_TYPES.length);
                        colorType = Math.floor(Math.random() * COLORS.length);
                    } while (wouldCreateMatch(row, col, candyType));
                    
                    board[row][col] = { type: candyType, color: colorType };
                    cell.textContent = CANDY_TYPES[candyType];
                    cell.classList.add(COLORS[colorType]);
                    
                    gameBoard.appendChild(cell);
                }
            }
            
            updateDisplay();
        }

        function wouldCreateMatch(row, col, type) {
            // Controlla match orizzontale
            if (col >= 2 && 
                board[row] && board[row][col-1] && board[row][col-2] &&
                board[row][col-1].type === type && board[row][col-2].type === type) {
                return true;
            }
            
            // Controlla match verticale
            if (row >= 2 && 
                board[row-1] && board[row-1][col] && board[row-2] && board[row-2][col] &&
                board[row-1][col].type === type && board[row-2][col].type === type) {
                return true;
            }
            
            return false;
        }

        function cellClick(event) {
            if (gameOver || moves <= 0) return;
            
            const cell = event.target;
            const row = parseInt(cell.dataset.row);
            const col = parseInt(cell.dataset.col);
            
            if (selectedCell) {
                if (selectedCell.row === row && selectedCell.col === col) {
                    // Deseleziona
                    cell.classList.remove('selected');
                    selectedCell = null;
                } else if (isAdjacent(selectedCell, {row, col})) {
                    // Scambia
                    swapCandies(selectedCell, {row, col});
                    document.querySelector(`[data-row="${selectedCell.row}"][data-col="${selectedCell.col}"]`).classList.remove('selected');
                    selectedCell = null;
                } else {
                    // Seleziona nuova cella
                    document.querySelector(`[data-row="${selectedCell.row}"][data-col="${selectedCell.col}"]`).classList.remove('selected');
                    cell.classList.add('selected');
                    selectedCell = {row, col};
                }
            } else {
                // Prima selezione
                cell.classList.add('selected');
                selectedCell = {row, col};
            }
        }

        function isAdjacent(cell1, cell2) {
            const rowDiff = Math.abs(cell1.row - cell2.row);
            const colDiff = Math.abs(cell1.col - cell2.col);
            return (rowDiff === 1 && colDiff === 0) || (rowDiff === 0 && colDiff === 1);
        }

        function swapCandies(cell1, cell2) {
            // Scambia nel board
            const temp = board[cell1.row][cell1.col];
            board[cell1.row][cell1.col] = board[cell2.row][cell2.col];
            board[cell2.row][cell2.col] = temp;
            
            // Aggiorna visuale
            updateBoard();
            
            // Controlla matches
            setTimeout(() => {
                const hasMatches = findAndRemoveMatches();
                if (hasMatches) {
                    moves--;
                    updateDisplay();
                    setTimeout(() => {
                        dropCandies();
                        setTimeout(() => {
                            fillEmptySpaces();
                            checkGameState();
                        }, 300);
                    }, 300);
                } else {
                    // Scambio non valido, ripristina
                    const temp = board[cell1.row][cell1.col];
                    board[cell1.row][cell1.col] = board[cell2.row][cell2.col];
                    board[cell2.row][cell2.col] = temp;
                    updateBoard();
                }
            }, 100);
        }

        function findAndRemoveMatches() {
            let matches = [];
            
            // Trova matches orizzontali
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE - 2; col++) {
                    if (board[row][col] && board[row][col+1] && board[row][col+2] &&
                        board[row][col].type === board[row][col+1].type &&
                        board[row][col].type === board[row][col+2].type) {
                        
                        let matchLength = 3;
                        while (col + matchLength < BOARD_SIZE && 
                               board[row][col + matchLength] &&
                               board[row][col].type === board[row][col + matchLength].type) {
                            matchLength++;
                        }
                        
                        for (let i = 0; i < matchLength; i++) {
                            matches.push({row: row, col: col + i});
                        }
                        col += matchLength - 1;
                    }
                }
            }
            
            // Trova matches verticali
            for (let col = 0; col < BOARD_SIZE; col++) {
                for (let row = 0; row < BOARD_SIZE - 2; row++) {
                    if (board[row][col] && board[row+1][col] && board[row+2][col] &&
                        board[row][col].type === board[row+1][col].type &&
                        board[row][col].type === board[row+2][col].type) {
                        
                        let matchLength = 3;
                        while (row + matchLength < BOARD_SIZE && 
                               board[row + matchLength][col] &&
                               board[row][col].type === board[row + matchLength][col].type) {
                            matchLength++;
                        }
                        
                        for (let i = 0; i < matchLength; i++) {
                            matches.push({row: row + i, col: col});
                        }
                        row += matchLength - 1;
                    }
                }
            }
            
            // Rimuovi duplicati
            matches = matches.filter((match, index, self) =>
                index === self.findIndex(m => m.row === match.row && m.col === match.col)
            );
            
            if (matches.length > 0) {
                // Rimuovi matches
                matches.forEach(match => {
                    board[match.row][match.col] = null;
                    const cell = document.querySelector(`[data-row="${match.row}"][data-col="${match.col}"]`);
                    cell.classList.add('match-hint');
                });
                
                // Aggiorna punteggio
                const points = matches.length * 10 * (matches.length > 3 ? 2 : 1);
                score += points;
                
                // Mostra combo
                if (matches.length > 3) {
                    showComboText(matches.length);
                }
                
                updateBoard();
                return true;
            }
            
            return false;
        }

        function showComboText(count) {
            const gameBoard = document.getElementById('gameBoard');
            const comboText = document.createElement('div');
            comboText.className = 'combo-text';
            comboText.textContent = count > 4 ? 'SUPER COMBO!' : 'COMBO!';
            comboText.style.left = '50%';
            comboText.style.top = '50%';
            gameBoard.style.position = 'relative';
            gameBoard.appendChild(comboText);
            
            setTimeout(() => {
                gameBoard.removeChild(comboText);
            }, 1000);
        }

        function dropCandies() {
            for (let col = 0; col < BOARD_SIZE; col++) {
                for (let row = BOARD_SIZE - 1; row >= 0; row--) {
                    if (board[row][col] === null) {
                        // Cerca caramelle sopra
                        for (let aboveRow = row - 1; aboveRow >= 0; aboveRow--) {
                            if (board[aboveRow][col] !== null) {
                                board[row][col] = board[aboveRow][col];
                                board[aboveRow][col] = null;
                                break;
                            }
                        }
                    }
                }
            }
            updateBoard();
        }

        function fillEmptySpaces() {
            for (let col = 0; col < BOARD_SIZE; col++) {
                for (let row = 0; row < BOARD_SIZE; row++) {
                    if (board[row][col] === null) {
                        const candyType = Math.floor(Math.random() * CANDY_TYPES.length);
                        const colorType = Math.floor(Math.random() * COLORS.length);
                        board[row][col] = { type: candyType, color: colorType };
                        
                        const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                        cell.classList.add('falling');
                        setTimeout(() => cell.classList.remove('falling'), 500);
                    }
                }
            }
            
            updateBoard();
            
            // Controlla se ci sono ancora matches dopo il riempimento
            setTimeout(() => {
                if (findAndRemoveMatches()) {
                    setTimeout(() => {
                        dropCandies();
                        setTimeout(() => {
                            fillEmptySpaces();
                        }, 300);
                    }, 300);
                }
            }, 600);
        }

        function updateBoard() {
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                    if (board[row][col]) {
                        cell.textContent = CANDY_TYPES[board[row][col].type];
                        cell.className = 'cell ' + COLORS[board[row][col].color];
                    } else {
                        cell.textContent = '';
                        cell.className = 'cell';
                    }
                }
            }
        }

        function updateDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('moves').textContent = moves;
            document.getElementById('level').textContent = level;
        }

        function checkGameState() {
            if (moves <= 0) {
                gameOver = true;
                const targetScore = level * 1000;
                if (score >= targetScore) {
                    level++;
                    moves = 30;
                    gameOver = false;
                    alert(`Livello ${level-1} completato! Benvenuto al livello ${level}!`);
                } else {
                    alert(`Game Over! Punteggio finale: ${score}`);
                }
                updateDisplay();
            }
        }

        function restartGame() {
            score = 0;
            moves = 30;
            level = 1;
            gameOver = false;
            selectedCell = null;
            initGame();
        }

        function showHint() {
            const cells = document.querySelectorAll('.cell');
            const randomCell = cells[Math.floor(Math.random() * cells.length)];
            randomCell.classList.add('match-hint');
            setTimeout(() => randomCell.classList.remove('match-hint'), 1000);
        }

        // Inizializza il gioco
        initGame();
    </script>
</body>
</html>
